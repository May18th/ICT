[project]
name = "decision-agent-poc"
version = "0.1.0"
description = "Minimal LangGraph + Pydantic AI + LangChain integration PoC"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core==1.7.0",
    "langgraph==1.2.17",
    "pydantic==2.14.1",
    "pydantic-ai-slim==2.61.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = false
