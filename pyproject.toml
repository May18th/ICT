[project]
name = "decision-agent-poc"
version = "0.1.0"
description = "Minimal LangGraph + Pydantic AI + LangChain integration PoC"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "langchain-core==1.7.0",
    "langgraph==1.2.17",
    "numpy>=2.5.4",
    "pydantic==2.14.1",
    "pydantic-ai-slim==2.61.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]
# 可选：真实语言模型（DeepSeek）需要的 OpenAI SDK；默认 `uv sync --locked` 不安装
llm = ["openai>=2.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = false
