[project]
name = "decision-agent-poc"
version = "0.1.0"
description = "Minimal LangGraph + Pydantic AI + LangChain integration PoC"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "langchain-core==1.7.0",
    "langgraph==1.2.17",
    "numpy>=2.5.4",
    "pydantic==2.14.1",
    "pydantic-ai-slim==2.61.0",
]

[build-system]
# 只用于把 src/ 装成 editable：`uv sync` 之后 `python -m decision_poc.*` 才可用。
# 不发布 wheel——samples/ 是仓库数据，不在包里（DEFAULT_DATASET_ROOT 按源码路径回推仓库根）。
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_poc"]

[dependency-groups]
dev = ["pytest==9.1.1"]
# 可选：真实语言模型（DeepSeek）需要的 OpenAI SDK；默认 `uv sync --locked` 不安装
llm = ["openai>=2.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
# 2026-11-07 由 false 改 true：false 时 `python -m decision_poc.web_demo` 直接报
# ModuleNotFoundError，README 里所有 `uv run ... -m decision_poc.xxx` 命令都是错的。
package = true
